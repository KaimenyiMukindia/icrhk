name: Build Production Release

on:
  push:
    branches:
      - replication-baseline
    tags:
      - 'v*.*.*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Production Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, curl, xml, zip, gd, bcmath, pdo_mysql
          tools: composer
          coverage: none

      - name: Validate Composer configuration
        working-directory: laravel-engine
        run: composer validate --no-check-publish --strict

      - name: Prepare Laravel writable directories
        working-directory: laravel-engine
        run: |
          mkdir -p bootstrap/cache
          chmod -R u+rwX bootstrap/cache

      - name: Install production dependencies
        working-directory: laravel-engine
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --classmap-authoritative

      - name: Prepare deployment directory
        run: |
          rm -rf release
          mkdir -p release

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='laravel-engine/.env' \
            --exclude='laravel-engine/storage/logs/*' \
            --exclude='wp-content/uploads/*' \
            --exclude='release/' \
            ./ release/

      - name: Verify Laravel vendor directory
        run: |
          test -f release/laravel-engine/vendor/autoload.php
          echo "Laravel production vendor directory is present."

      - name: Create deployment ZIP
        run: |
          cd release
          zip -r ../icrhk-production.zip .

      - name: Verify deployment ZIP
        run: |
          unzip -l icrhk-production.zip | grep 'laravel-engine/vendor/autoload.php'
          echo "Production artifact verified."

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: icrhk-production.zip
          generate_release_notes: true
